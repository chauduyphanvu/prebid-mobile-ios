# Fork-only: runs BaseInterstitialAdUnitTest on a macOS runner to reproduce the ad unit reuse bug.
# Not for upstream.
name: Repro - ad unit reuse after close

on:
  push:
    branches: ['repro/**']
  workflow_dispatch:

env:
  XCODE_VERSION: "26.5.0"

jobs:
  repro:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - run: pod install --repo-update
      - run: xcrun simctl create iPhone-17-Pro-Repro com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
      - name: Run BaseInterstitialAdUnitTest
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace PrebidMobile.xcworkspace \
            -scheme PrebidMobileTests \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone-17-Pro-Repro,OS=latest' \
            -only-testing:PrebidMobileTests/BaseInterstitialAdUnitTest \
            2>&1 | tee xcodebuild.log | grep -E "Test Case|error:|XCTAssert|\*\* TEST"
